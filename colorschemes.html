<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Phase Color Scheme Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 0.5rem; color: #fff; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .scheme-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .scheme-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 1.5rem;
            border-left: 4px solid #38bdf8;
            padding-left: 0.75rem;
        }
        .timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.5rem;
        }
        .step {
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #334155;
        }
        .swatch {
            width: 100%;
            height: 70px;
            position: relative;
        }
        .info {
            padding: 0.75rem 0.5rem;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .pct { font-weight: bold; font-size: 1.1rem; color: #fff; }
        .phase-lbl { font-size: 0.65rem; color: #64748b; text-transform: uppercase; margin: 2px 0 6px 0; }
        .rgb { font-family: monospace; font-size: 0.75rem; color: #94a3b8; }
        .target-snap { border: 2px solid #ef4444; transform: scale(1.03); }
        .snap-badge {
            position: absolute; top: 2px; right: 2px;
            background: #ef4444; color: white; font-size: 0.55rem;
            padding: 1px 4px; border-radius: 3px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Bike Computer Profile Progression Schemes</h1>
    <div class="subtitle">Visualizing <code>getDynamicColor(progress, scheme)</code> multi-tier target algorithms.</div>

    <div id="documentation-target"></div>

    <script>
        const SCHEMES = ['INFRARED', 'CYBERPUNK', 'PODIUM', 'PASTEL', 'CLASSIC'];
        const STEPS = [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5];

        function transitionFromTo(rFrom, gFrom, bFrom, rTo, gTo, bTo, factor) {
            const r = Math.round(rFrom + (rTo - rFrom) * factor);
            const g = Math.round(gFrom + (gTo - gFrom) * factor);
            const b = Math.round(bFrom + (bTo - bFrom) * factor);
            return { r, g, b, label: "" };
        }

        function getDynamicColor(progress, scheme) {
            // Target Snap Point
            if (progress >= 0.98 && progress <= 1.02) {
                let res = { r:255, g:215, b:0, label: "Snap" }; // default gold
                if (scheme === 'INFRARED') res = { r:0, g:255, b:0 };
                if (scheme === 'CYBERPUNK') res = { r:0, g:255, b:210 };
                if (scheme === 'PODIUM') res = { r:255, g:215, b:0 };
                if (scheme === 'PASTEL') res = { r:244, g:244, b:246 };
                res.label = "Snap";
                return res;
            }

            // Phase 1: 0% to 50%
            if (progress <= 0.5) {
                const f = progress / 0.5;
                let c = (scheme === 'INFRARED') ? transitionFromTo(70, 73, 76, 0, 140, 160, f) :
                        (scheme === 'CYBERPUNK') ? transitionFromTo(10, 25, 60, 0, 210, 255, f) :
                        (scheme === 'PODIUM') ? transitionFromTo(120, 70, 45, 190, 115, 65, f) :
                        (scheme === 'PASTEL') ? transitionFromTo(215, 218, 222, 190, 210, 230, f) :
                                                transitionFromTo(0, 0, 255, 0, 255, 0, f);
                c.label = "Phase 1"; return c;
            }
            // Phase 2: 50% to 100%
            else if (progress <= 1.0) {
                const f = (progress - 0.5) / 0.5;
                let c = (scheme === 'INFRARED') ? transitionFromTo(0, 140, 160, 0, 255, 0, f) :
                        (scheme === 'CYBERPUNK') ? transitionFromTo(0, 210, 255, 150, 255, 0, f) :
                        (scheme === 'PODIUM') ? transitionFromTo(190, 115, 65, 210, 215, 220, f) :
                        (scheme === 'PASTEL') ? transitionFromTo(190, 210, 230, 190, 225, 205, f) :
                                                transitionFromTo(0, 255, 0, 255, 215, 0, f);
                c.label = "Phase 2"; return c;
            }
            // Phase 3: 100% to 200%
            else if (progress <= 2.0) {
                const f = Math.min((progress - 1.0) / 1.0, 1.0);
                let c = (scheme === 'INFRARED') ? transitionFromTo(0, 255, 0, 255, 110, 0, f) :
                        (scheme === 'CYBERPUNK') ? transitionFromTo(150, 255, 0, 255, 0, 130, f) :
                        (scheme === 'PODIUM') ? transitionFromTo(210, 215, 220, 255, 215, 0, f) :
                        (scheme === 'PASTEL') ? transitionFromTo(190, 225, 205, 245, 205, 190, f) :
                                                transitionFromTo(255, 215, 0, 139, 0, 0, f);
                c.label = "Phase 3"; return c;
            }
            // Phase 4: Beyond 200%
            else {
                const f = Math.min((progress - 2.0) / 1.0, 1.0);
                let c = (scheme === 'INFRARED') ? transitionFromTo(255, 110, 0, 90, 0, 80, f) :
                        (scheme === 'CYBERPUNK') ? transitionFromTo(255, 0, 130, 255, 255, 255, f) :
                        (scheme === 'PODIUM') ? transitionFromTo(255, 215, 0, 160, 245, 220, f) :
                        (scheme === 'PASTEL') ? transitionFromTo(245, 205, 190, 220, 200, 230, f) :
                                                transitionFromTo(139, 0, 0, 40, 0, 5, f);
                c.label = "Phase 4"; return c;
            }
        }

        const target = document.getElementById('documentation-target');

        SCHEMES.forEach(scheme => {
            const section = document.createElement('div');
            section.className = 'scheme-card';
            section.innerHTML = `<div class="scheme-title">SCHEME_${scheme}</div>`;
            
            const timeline = document.createElement('div');
            timeline.className = 'timeline';

            STEPS.forEach(p => {
                const color = getDynamicColor(p, scheme);
                const rgbStr = `rgb(${color.r}, ${color.g}, ${color.b})`;
                const isSnap = color.label === "Snap";
                
                const stepEl = document.createElement('div');
                stepEl.className = `step ${isSnap ? 'target-snap' : ''}`;
                stepEl.innerHTML = `
                    <div class="swatch" style="background-color: ${rgbStr}">
                        ${isSnap ? '<span class="snap-badge">HIT</span>' : ''}
                    </div>
                    <div class="info">
                        <div class="pct">${Math.round(p * 100)}%</div>
                        <div class="phase-lbl">${color.label}</div>
                        <div class="rgb">${color.r},${color.g},${color.b}</div>
                    </div>
                `;
                timeline.appendChild(stepEl);
            });

            section.appendChild(timeline);
            target.appendChild(section);
        });
    </script>
</body>
</html>
